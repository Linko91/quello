packages:
  - 'packages/*'
  - 'playgrounds/*'
  - 'docs'

allowBuilds:
  esbuild: true
  sharp: true
  lmdb: true
  msgpackr-extract: true
  "@parcel/watcher": true
  nx: true
  better-sqlite3: true
  vue-demi: true

overrides:
  # docs declares ^13.0.3, but docus@5 peers on better-sqlite3 12.x. Pin the
  # resolution back to 12 so the docs build/deploy matches what docus expects.
  better-sqlite3: ^12.11.1
