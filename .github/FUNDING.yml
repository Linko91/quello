# The funding links GitHub shows behind the Sponsor button and in the "Sponsor
# this project" panel. This file is only half of it: the button stays hidden
# until Sponsorships is ticked under Settings → General → Features. GitHub also
# renders an entry only once the account behind it exists, so a key added ahead
# of its account shows nothing rather than breaking the file.
#
# Entries appear in the order listed here.

github: [Linko91]
buy_me_a_coffee: dverse

